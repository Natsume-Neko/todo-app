<form class="todo-form" [formGroup]="form" (ngSubmit)="submit()">
  <label class="field">
    <span class="field__label">タイトル</span>
    <input type="text" formControlName="title" />
    @let title = form.controls.title;
    @if (title.touched && title.hasError('required')) {
      <span class="field__error">タイトルは必須です</span>
    }
    @if (title.hasError('maxlength')) {
      <span class="field__error">255文字以内で入力してください</span>
    }
    @for (msg of serverErrors()['title'] ?? []; track msg) {
      <span class="field__error">{{ msg }}</span>
    }
  </label>

  <label class="field">
    <span class="field__label">本文</span>
    <textarea rows="3" formControlName="body"></textarea>
    @let body = form.controls.body;
    @if (body.hasError('maxlength')) {
      <span class="field__error">21845文字以内で入力してください</span>
    }
    @for (msg of serverErrors()['body'] ?? []; track msg) {
      <span class="field__error">{{ msg }}</span>
    }
  </label>

  <label class="field">
    <span class="field__label">カテゴリ</span>
    <select formControlName="categoryId">
      <option [ngValue]="null" disabled>選択してください</option>
      @for (c of categories(); track c.id) {
        <option [ngValue]="c.id">{{ c.name }}</option>
      }
    </select>
    @let categoryId = form.controls.categoryId;
    @if (categoryId.touched && categoryId.hasError('required')) {
      <span class="field__error">カテゴリは必須です</span>
    }
    @for (msg of serverErrors()['categoryId'] ?? []; track msg) {
      <span class="field__error">{{ msg }}</span>
    }
  </label>

  <div class="todo-form__actions">
    @if (generalError(); as message) {
      <span class="todo-form__error" role="alert">{{ message }}</span>
    }
    <button type="submit" class="button" [disabled]="submitting()">作成</button>
  </div>
</form>
